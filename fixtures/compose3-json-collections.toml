schema = "sim.characterization-ledger/v1"
phase = "COMPOSE3.00"
content_id_algorithm = "sha256(domain + U+001F + scenario + U+001F + source_anchor + U+001F + outcome)"

[[scenario]]
domain = "json"
name = "parse-error"
source_anchor = "crates/sim-lib-lang-javascript/src/json.rs::parse_javascript_json"
outcome = "invalid input is Parse carrying serde_json display text; no reviver call"

[[scenario]]
domain = "json"
name = "parse-number"
source_anchor = "crates/sim-lib-lang-javascript/src/json.rs::from_canonical"
outcome = "JSON number projects through codec untagged f64 and becomes JavascriptJsonValue::Number(f64)"

[[scenario]]
domain = "json"
name = "stringify-number"
source_anchor = "crates/sim-lib-lang-javascript/src/json.rs::to_canonical"
outcome = "finite f64 uses serde_json Number rendering; NaN and both infinities return NonFinite"

[[scenario]]
domain = "json"
name = "property-order"
source_anchor = "crates/sim-lib-lang-javascript/src/json.rs::ordered_entries"
outcome = "canonical u32 indices except 4294967295 sort ascending, then other string keys retain insertion order"

[[scenario]]
domain = "json"
name = "duplicate-properties"
source_anchor = "crates/sim-lib-lang-javascript/src/json.rs::to_canonical"
outcome = "object projection inserts into serde_json Map, so a later duplicate string key replaces the earlier value"

[[scenario]]
domain = "json"
name = "reviver-order"
source_anchor = "crates/sim-lib-lang-javascript/src/json.rs::walk_reviver"
outcome = "depth-first postorder; array indices and object keys precede the empty root key"

[[scenario]]
domain = "json"
name = "reviver-delete"
source_anchor = "crates/sim-lib-lang-javascript/src/json.rs::walk_reviver"
outcome = "None deletes an object property, becomes Undefined in an array cell, and becomes root Undefined at root"

[[scenario]]
domain = "json"
name = "hook-order"
source_anchor = "crates/sim-lib-lang-javascript/src/json.rs::project"
outcome = "toJSON is called before replacer for root and every recursively projected value"

[[scenario]]
domain = "json"
name = "replacer-delete"
source_anchor = "crates/sim-lib-lang-javascript/src/json.rs::project"
outcome = "replacer None omits an object property, substitutes null in an array, and yields no root string"

[[scenario]]
domain = "json"
name = "undefined"
source_anchor = "crates/sim-lib-lang-javascript/src/json.rs::project"
outcome = "Undefined omits object members, renders null in arrays, and yields None at root"

[[scenario]]
domain = "json"
name = "cycle-detection"
source_anchor = "crates/sim-lib-lang-javascript/src/json.rs::project"
outcome = "ancestor pointer repetition returns Cycle, but owned recursive enum values cannot construct a reference cycle so this error is unreachable"

[[scenario]]
domain = "json"
name = "codec-projection"
source_anchor = "crates/sim-codec-json/src/projection.rs::project_json_to_expr,project_expr_to_json"
outcome = "guest parse and stringify both call the untagged interop projection in both directions"

[[scenario]]
domain = "json"
name = "work-limits"
source_anchor = "crates/sim-codec-json/src/projection.rs::project_json_to_expr_budgeted"
outcome = "budgeted codec projection charges nodes, collection lengths, strings, and nesting; JavaScript JSON entry points use the unbudgeted projection"

[[scenario]]
domain = "array"
name = "sparse-holes"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptArray"
outcome = "sparse creates explicit holes; get and pop expose a hole as None while values materializes it as Undefined"

[[scenario]]
domain = "array"
name = "length-growth"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptArray::set"
outcome = "setting beyond length grows to index plus one and fills intervening cells with holes"

[[scenario]]
domain = "array"
name = "length-truncation"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptArray::pop"
outcome = "pop truncates exactly one cell; no general length setter or multi-cell truncation surface exists"

[[scenario]]
domain = "array"
name = "map-holes-and-limit"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptArray::map"
outcome = "map skips and retains holes; if present-cell count exceeds max_visits it returns Limit before any callback"

[[scenario]]
domain = "array"
name = "filter-holes-and-limit"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptArray::filter"
outcome = "filter skips holes and returns dense output; it can invoke callbacks before a later visit exceeds max_visits and returns Limit"

[[scenario]]
domain = "collection"
name = "same-value-zero"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::same_value_zero"
outcome = "all NaN numbers compare equal and negative zero equals positive zero; other JavascriptValue arms use PartialEq"

[[scenario]]
domain = "map"
name = "insertion-order"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptMap::set"
outcome = "first insertion fixes position and replacement preserves it"

[[scenario]]
domain = "map"
name = "delete-reinsert"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptMap::delete"
outcome = "delete removes the entry and a later set appends it at the end"

[[scenario]]
domain = "map"
name = "mutation-during-iteration"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptMap::entries"
outcome = "entry iteration borrows the map, preventing overlapping mutation through the safe public API"

[[scenario]]
domain = "set"
name = "insertion-order"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptSet::add"
outcome = "first SameValueZero-unique insertion fixes position and a duplicate is ignored"

[[scenario]]
domain = "set"
name = "delete-reinsert"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptSet::delete"
outcome = "delete removes the value and a later add appends it at the end"

[[scenario]]
domain = "iterator"
name = "mutation-during-iteration"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptIterator::new"
outcome = "array and set iterators own cloned snapshots, so later source mutations are not observed"

[[scenario]]
domain = "iterator"
name = "completion"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptIterator::next_result"
outcome = "each captured value returns done false; exhaustion and every later call return absent value with done true"

[[scenario]]
domain = "symbol"
name = "identity"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptSymbolRegistry::symbol"
outcome = "every allocation gets a fresh realm-local numeric id even when descriptions match; description never participates in equality"

[[scenario]]
domain = "symbol"
name = "global-registry"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptSymbolRegistry::symbol_for,key_for"
outcome = "symbol_for repeats identity by string key and key_for returns a key only for a registered identity"

[[scenario]]
domain = "collection"
name = "declared-errors"
source_anchor = "crates/sim-lib-lang-javascript/src/collections.rs::JavascriptCollectionError"
outcome = "Limit is returned by bounded map and filter; Index is declared but no current public collection method returns it"

