[[feature]]
id = "feature/sim-runtime/javascript-core-profile"
title = "Embedded capability-scoped ECMAScript profile"
summary = "Run embedded, capability-scoped ECMAScript over SIM values with ordinary objects, exact UTF-16 strings, explicit drain-to-empty jobs, authorized source modules, and no Node, DOM, timers, ambient host IO, or implicit event loop."
owner = "crate/sim-lib-lang-javascript"
audiences = ["code", "framework"]
guidance = "Use this checked profile as the end of the add-guest-language route for embedded, capability-scoped ECMAScript over SIM values, never as a Node replacement. Enter through codec/javascript and compose shared binding, descriptor dispatch, managed identity, sequence, pattern, JSON codec, tracing, resumable-frame, typed-job, diminished read-eval, and source-module mechanics. JavaScript allocations are ManagedNode values with only an open JavascriptManagedKind role label; allocate them through the generic ManagedHeap and use its checked strong, weak, and ephemeron operations rather than introducing guest graph storage or policy. Generators and async functions exchange shared ResumePacket values; promises, async continuations, and dynamic imports enter the JavaScript language-microtask FIFO and run only at an explicit drain-to-empty checkpoint. Collector finalization has a distinct queue class and checkpoint. ESM resolution is confined to supplied Dir roots and inherits canonical identities, live binding cells, cycle/failure receipts, and installed-codec evaluation from sim-lib-namespace; dynamic source likewise enters only through ReadEvalBroker with host-authored diminished authority. The generated intrinsic manifest covers sparse arrays, iterators, Map, Set, Symbol, exact UTF-16 code units, and JSON reviver/toJSON/replacer/property-order/cycle policy. RegExp v1 executes only literals, dot, anchors, simple classes, ASCII d/s/w classes, and ?/*/+ in the bounded pattern organ; all flags, alternation, groups, backreferences, lookaround, Unicode properties/sets, word boundaries, and counted quantifiers fail closed. Node, CommonJS, npm, DOM, fetch, timers, filesystem, processes, network, ambient host IO, and an implicit event loop are deliberately absent. JAVA_SCRIPT_6 pattern-engine work is the first JavaScript successor requirement. Callable browse Shapes remain neutral, and Proxy and exotic-object invariants are explicit gaps; do not add an engine, VM, Realm, scheduler, event loop, private managed substrate, private module cache, TypeScript policy, or foreign runtime."
claims_anchors = ["anchor/crate/sim-lib-lang-javascript"]
claims_specimens = [
  "spec-test/sim-runtime/crates/sim-lib-lang-javascript/src/lib",
]
supports = ["feature/sim-runtime/guest-language-profiles", "feature/sim-runtime/organs", "feature/sim-runtime/gc-tracing"]

[[feature]]
id = "feature/sim-runtime/typescript-notation-profile"
title = "TypeScript notation over JavaScript evaluation"
summary = "TypeScript notation; does not type-check. Load admitted notation by direct JavaScript erasure while retaining faithful, non-enforcing Shape metadata and explicit compiler gaps."
owner = "crate/sim-lib-lang-typescript"
audiences = ["code", "framework"]
guidance = "Use codec/typescript to produce an erased JavaScript graph and annotation provenance, then install language/typescript-notation. The profile delegates evaluation unchanged to the JavaScript direct-eval policy and uses sim-shape's neutral BrowseSignature only for observational callable metadata. It performs no binding, inference, narrowing, assignability, source preflight, compiler diagnostics, emit, runtime type guard, object model, module cache, or independent evaluation."
claims_anchors = ["anchor/crate/sim-lib-lang-typescript"]
claims_specimens = [
  "spec-test/sim-runtime/crates/sim-lib-lang-typescript/src/lib",
]
supports = ["feature/sim-runtime/javascript-core-profile", "feature/sim-runtime/guest-language-profiles"]

[[feature]]
id = "feature/sim-runtime/class-semantics"
title = "Language-neutral declared class semantics"
summary = "Own checked declared-parent class descriptors projected onto the kernel Class protocol, with bounded lineage policies and managed, non-retaining caches for linearizations and derived member views."
owner = "crate/sim-lib-class"
audiences = ["code", "framework"]
guidance = "Use sim-lib-class for language-neutral declared superclass graphs. DescriptorClass delegates construction while projecting checked constructor, instance, member, and read-construction metadata through the existing kernel Class, Shape, table, and read-constructor hooks; its subclass query returns bounded traversal evidence. Reuse the kernel Class protocol and compose the C3 algorithm characterized from the Python profile. Use ClassCache for revision-checked linearizations and root-first member views: it composes MANAGED_2 strong parent edges and ephemerons so cached values remain live exactly while their class key is reachable. Do not replace it with a process-global map keyed by class identity, which would retain derived state outside managed tracing. JavaScript prototypes, Lua metatables, typeclass dictionaries, Prolog relations, generic dispatch specificity, and JVM defining-loader identity are explicitly different semantic domains; exclusion_ledger records the exact mismatch and non_goals records the behavior that must remain with those owners. Do not infer class ancestry from property lookup, metamethod delegation, constraint evidence, predicate names, method applicability, or loader namespaces."
claims_anchors = ["anchor/crate/sim-lib-class"]
claims_specimens = [
  "spec-test/sim-runtime/crates/sim-lib-class/src/tests",
  "spec-test/sim-runtime/crates/sim-lib-class/src/cache/tests",
]
supports = ["feature/sim-runtime/organs"]

