guidance = "Use the containers for capability-gated runtime mutation. Use ManagedArena with HardCappedRetainPolicy when a framework needs language-neutral managed identity and a collector-facing strong, weak, ephemeron, safepoint, clearing, and teardown seam; install collection policy separately."
claims_anchors = [
