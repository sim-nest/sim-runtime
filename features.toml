[[feature]]
id = "feature/sim-runtime/organs"
title = "Runtime organs"
summary = "Provide binding, function, control, logic, pattern, incremental, mutation, namespace, and sequence organs as reusable runtime behavior."
owner = "crate/sim-lib-binding"
audiences = ["code", "framework"]
guidance = "Use this row when composing reusable runtime behavior from small organ crates and loadable libraries. sim-lib-binding owns the language-neutral call-signature binder and shared binding-cell lifecycle used by guest profiles. sim-lib-function owns immutable function plans and typed managed instances whose capture edges remain visible to the shared collector. Every guest raises sim-lib-control Raised, obtains its class identity from a declared class descriptor, selects handlers with the bounded class matcher, and stores cause, context, group, and suppression relations as stable ManagedException edges. Guest profiles own the meaning of those edge roles, but exception-ownership.toml rejects another class-and-payload carrier or recursive Box/Vec relation chain outside the control organ and explicitly admits named guest object fields by their declared owner. sim-lib-control also owns budgeted resumable frames, cleanup-safe generic unwind, and explicitly driven typed FIFO job queues. Microtasks and finalization remain distinct queue classes, and selected-class checkpoints drain reentrant work to empty under caller-declared bounds. sim-lib-pattern is the one matcher organ: guests may own declared syntax parsers and result-policy adapters, but pattern-ownership.toml rejects guest NFA state, backtracking drivers, and roadmap-family public diagnostics and keeps every pattern overlap classified."
claims_anchors = [
  "anchor/crate/sim-lib-control",
  "anchor/crate/sim-lib-function",
  "anchor/crate/sim-lib-logic",
  "anchor/crate/sim-lib-pattern",
  "anchor/crate/sim-lib-sequence",
  "anchor/runtime-lib/sim-lib-logic/logic-lib",
  "anchor/runtime-lib/sim-lib-pattern/pattern-lib",
  "anchor/runtime-lib/sim-lib-sequence/sequence-lib",
]
claims_specimens = [
  "spec-test/sim-runtime/crates/sim-lib-logic/src/tests/organ_proof",
  "spec-test/sim-runtime/crates/sim-lib-pattern/tests/ownership_guard",
]

