major_entrypoints = "advisory"
frameworks = "advisory"

[[feature]]
id = "feature/sim-runtime/javascript-core-profile"
title = "Embedded capability-scoped ECMAScript profile"
summary = "Run embedded, capability-scoped ECMAScript over SIM values with ordinary objects, exact UTF-16 strings, explicit drain-to-empty jobs, authorized source modules, and no Node, DOM, timers, ambient host IO, or implicit event loop."
owner = "crate/sim-lib-lang-javascript"
audiences = ["code", "framework"]
guidance = "Use this checked profile as the end of the add-guest-language route for embedded, capability-scoped ECMAScript over SIM values, never as a Node replacement. Enter through codec/javascript and compose shared binding, descriptor dispatch, managed identity, sequence, pattern, JSON codec, tracing, resumable-frame, typed-job, diminished read-eval, and source-module mechanics. Generators and async functions exchange shared ResumePacket values; promises, async continuations, and dynamic imports enter the JavaScript language-microtask FIFO and run only at an explicit drain-to-empty checkpoint. Collector finalization has a distinct queue class and checkpoint. ESM resolution is confined to supplied Dir roots and inherits canonical identities, live binding cells, cycle/failure receipts, and installed-codec evaluation from sim-lib-namespace; dynamic source likewise enters only through ReadEvalBroker with host-authored diminished authority. The generated intrinsic manifest covers sparse arrays, iterators, Map, Set, Symbol, exact UTF-16 code units, and JSON reviver/toJSON/replacer/property-order/cycle policy. RegExp v1 executes only literals, dot, anchors, simple classes, ASCII d/s/w classes, and ?/*/+ in the bounded pattern organ; all flags, alternation, groups, backreferences, lookaround, Unicode properties/sets, word boundaries, and counted quantifiers fail closed. Node, CommonJS, npm, DOM, fetch, timers, filesystem, processes, network, ambient host IO, and an implicit event loop are deliberately absent. JAVA_SCRIPT_6 pattern-engine work is the first JavaScript successor requirement. Callable browse Shapes remain neutral, and Proxy and exotic-object invariants are explicit gaps; do not add an engine, VM, Realm, scheduler, event loop, private module cache, TypeScript policy, or foreign runtime."
claims_anchors = ["anchor/crate/sim-lib-lang-javascript"]
supports = ["feature/sim-runtime/guest-language-profiles", "feature/sim-runtime/organs", "feature/sim-runtime/gc-tracing"]

[[feature]]
id = "feature/sim-runtime/typescript-notation-profile"
title = "TypeScript notation over JavaScript evaluation"
summary = "Load admitted TypeScript notation by direct JavaScript erasure while retaining faithful, non-enforcing Shape metadata and explicit compiler gaps."
owner = "crate/sim-lib-lang-typescript"
audiences = ["code", "framework"]
guidance = "Use codec/typescript to produce an erased JavaScript graph and annotation provenance, then install language/typescript-notation. The profile delegates evaluation unchanged to the JavaScript direct-eval policy and uses sim-shape's neutral BrowseSignature only for observational callable metadata. It performs no binding, inference, narrowing, assignability, source preflight, compiler diagnostics, emit, runtime type guard, object model, module cache, or independent evaluation."
claims_anchors = ["anchor/crate/sim-lib-lang-typescript"]
supports = ["feature/sim-runtime/javascript-core-profile", "feature/sim-runtime/guest-language-profiles"]

