[[feature]]
id = "feature/sim-runtime/machine-contract"
title = "Neutral bounded instruction-machine contract"
summary = "Define policy seams and explicit bounded, resumable frames for decoded instructions, logical widths, calls, returns, protected handlers, cleanup, interruption, roots, safepoints, admission, and receipts without choosing a guest or host mechanism."
owner = "crate/sim-lib-machine"
audiences = ["code", "framework"]
guidance = "Use these traits, Frame, FrameStack, Transfer, Driver, and MachineCheckpoint when building a bounded decoded-instruction machine. Frames compose bounded slots and operands with a validated cursor, continuation, roots, and handler state. Implement ManagedRootSource with sim-lib-mutation ManagedId values and use drive_with_safepoints to publish a complete, budgeted caller-to-current root snapshot before each prepared safepoint; the observer selects reclamation policy. Calls and returns are explicit value-and-width transfers; protected raises select the innermost prepared handler; cleanup composes sim-lib-control CleanupStack and Unwind; interruption checkpoints bind frame state and the receipt prefix to the admitted content identity. FrameStack reports typed depth exhaustion without consuming the host call stack. Compose sim-lib-control for unwind, resume packets, cleanup, and shared admission/work limits; sim-lib-mutation for managed roots; Shape for structural admission; and caller-supplied codecs for instruction identity. Guest crates may own decoded instruction and opcode enums and their language-specific execution semantics, but must implement those semantics behind Driver while reusing this crate's SlotFile, UnitStack, Frame, FrameStack, iterative drive loop, and receipts. A guest-owned generic slot, operand-stack, frame-stack, frame-driver, or recursive interpreter loop is an ownership regression. Do not add a machine-local root registry, import a guest method, signature, or class model, move decoded execution into kernel evaluation, duplicate unwind or resume machinery, or use sim-lib-exec as a machine driver."
claims_anchors = [
  "anchor/crate/sim-lib-machine",
  "anchor/rustdoc/sim-lib-machine/driver",
  "anchor/rustdoc/sim-lib-machine/frame-stack",
  "anchor/rustdoc/sim-lib-machine/slot-file",
  "anchor/rustdoc/sim-lib-machine/unit-stack",
]
claims_specimens = [
  "spec-test/sim-runtime/crates/sim-lib-machine/tests/frame_calls_conformance",
  "spec-test/sim-runtime/crates/sim-lib-machine/tests/control_resume",
  "spec-test/sim-runtime/crates/sim-lib-machine/tests/neutral_machine_specimens",
  "spec-test/sim-runtime/crates/sim-lib-machine/tests/ownership_guard",
]
supports = [
  "feature/sim-runtime/organs",
]

[[feature]]
id = "feature/sim-runtime/gc-tracing"
title = "Bounded tracing garbage collection"
summary = "Reclaim unreachable managed-object cycles with deterministic, failure-atomic stop-the-world tracing."
owner = "crate/sim-lib-gc-tracing"
audiences = ["code", "framework"]
guidance = "Use ManagedHeap<T> as the one tracing-or-retain policy wrapper over sim-lib-mutation's ManagedArena; do not add a guest-owned arena wrapper. Use collect with explicit object, edge, stack, clear, finalizer, and total-work limits. Collection plans synchronously at a safepoint and refuses before its allocation-ordered atomic sweep when the complete plan cannot be admitted. Receipt determinism follows allocation-deterministic managed ids; different legal schedules must preserve safety, not identical reclamation timing. Reuse the language-neutral managed-graph recipe and generated-graph and wasm-closure specimens; this storage collector claims no language capability."
claims_anchors = [
  "anchor/crate/sim-lib-gc-tracing",
  "anchor/card/cookbook/gc-tracing",
]
claims_specimens = [
  "spec-test/sim-runtime/crates/sim-lib-gc-tracing/src/tests",
]
supports = [
  "feature/sim-runtime/organs",
]

[[feature]]
id = "feature/sim-runtime/mutation-organ"
title = "Mutation organ"
summary = "Expose capability-gated mutable containers plus a bounded, allocation-deterministic managed-object arena and versioned tracing contract."
owner = "crate/sim-lib-mutation"
audiences = ["code", "framework"]
guidance = "Use the containers for capability-gated runtime mutation. Use ManagedArena with HardCappedRetainPolicy when a framework needs language-neutral managed identity and a collector-facing strong, weak, ephemeron, safepoint, clearing, and teardown seam; install collection policy separately. Build every guest object graph through the one ManagedNode<R> checked edge API rather than cloning its storage. Edge ids are monotonic and never reused; trace order is edge-id order; clearing succeeds only when owner, kind, and expected identities match. Explicit EdgeLimits make stale identities, wrong kinds, changed targets, identity exhaustion, and total or per-kind capacity exhaustion fail atomically. R is open caller evidence and never affects tracing, retention, collection order, or limits. RoleBearingManagedObject and bounded project_roles add allocation-ordered audit labels without advancing the graph epoch."
claims_anchors = [
  "anchor/crate/sim-lib-mutation",
  "anchor/card/cookbook/organ/mutation",
]
claims_specimens = [
  "spec-test/sim-runtime/crates/sim-lib-mutation/src/tests",
  "spec-test/sim-runtime/crates/sim-lib-mutation/src/managed_tests",
]
supports = [
  "feature/sim-runtime/organs",
  "feature/sim-runtime/gc-tracing",
]

