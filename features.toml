[[route]]
id = "route/collect-language-neutral-managed-graph"
task = "Collect a language-neutral managed graph"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-runtime/mutation-organ", why = "The mutation row supplies allocation-deterministic managed ids, graph storage, roots, weak edges, ephemerons, and safepoints without selecting a guest language." },
  { feature = "feature/sim-runtime/gc-tracing", why = "The collector row supplies bounded synchronous tracing, atomic sweep, weak clearing, and isolated finalization admission without claiming language behavior." },
  { specimen = "spec-test/sim-runtime/crates/sim-lib-gc-tracing/src/tests", why = "The checked non-language managed-graph specimen compares generated graphs and safepoint schedules with a model tracer and proves wasm-closure collection." },
]

