[[feature]]
id = "feature/sim-runtime/guest-language-profiles"
title = "Small guest-language profiles"
summary = "Add source-language surfaces as readers, direct Expr lowering, checked eval policy, and shared organ composition without guest-owned runtime machinery."
owner = "crate/sim-lib-standard-core"
audiences = ["code", "framework"]
guidance = "Start from the checked LanguageProfile and GuestProfileEvidence thin-profile contract, follow Lua's codec and profile as the no-compiler reference, register the crate in guest-profiles.toml, reuse organs, and finish by adding the profile to the shared language matrix. Lua closures demonstrate the required function boundary: FunctionPlan owns declaration metadata, FunctionInstance owns callable identity and managed capture edges, BindingCell preserves one shared upvalue, and LuaBodyPolicy alone retains varargs, multiple returns, evaluation, and coroutine semantics. Lua protected calls carry failures only through sim-lib-control Raised: LuaExceptionProfile supplies the canonical raised-value class, retains the exact payload Value identity, and declares Lua's exact-class match policy; pcall and xpcall unwrap the payload at their existing guest-visible boundary. Lua __index remains table-or-callable metatable dispatch through MetaObjectProtocol and is explicitly not class lineage. A guest may own instruction or opcode data and language-specific instruction semantics. It may not own generic slots, operand or frame stacks, a frame driver, or a recursive interpreter loop; compose the neutral machine contract for those mechanics."
claims_anchors = [
  "anchor/rustdoc/sim-lib-lang-lua/lua_reader_symbol",
  "anchor/rustdoc/sim-lib-lang-lua/lua_core_profile",
  "anchor/rustdoc/sim-lib-lang-matrix/language_matrix",
]
claims_specimens = [
  "spec-test/sim-runtime/crates/sim-lib-lang-lua/src/conformance",
  "spec-test/sim-runtime/crates/sim-lib-lang-lua/src/lib",
]
supports = [
  "feature/sim-runtime/library-loading",
  "feature/sim-runtime/organs",
]

[[feature]]
id = "feature/sim-runtime/python-object-control-policy"
title = "Checked Python objects and resumable control"
summary = "Compose Python classes, C3, descriptors, bound methods, super, checked exceptions, context cleanup, generators, coroutines, and cyclic collection over shared runtime organs."
owner = "crate/sim-lib-lang-python"
audiences = ["code", "framework"]
guidance = "Use PythonObjectSpace for Python-owned descriptor lookup, binding, super, metaclass, and class-mutation policy layered over sim-lib-class. Declared parents live in ClassDescriptor, identity remains a kernel ClassRef, C3 linearization uses C3Policy, and derived MRO views use ClassCache ephemeron ownership. Use PythonExceptions to allocate class-bearing exception payloads in the shared ManagedException adapter, retain cause, context, and ordered group-member relations by typed managed edges, construct only non-empty groups, and route raise, catch, and group splitting through Raised plus the bounded shared class matcher. Use PythonGenerator for bounded send/throw/close transitions and PythonHeap for the rest of the guest object graph. Inspect PYTHON_OBJECT_CONTROL_GAPS before admitting metaclass, dynamic descriptor mutation, weak-reference callback, finalizer, or event-loop behavior."
claims_anchors = [
  "anchor/rustdoc/sim-lib-lang-python/python-object-space",
  "anchor/rustdoc/sim-lib-lang-python/python-generator",
  "anchor/rustdoc/sim-lib-lang-python/python-exceptions",
  "anchor/rustdoc/sim-lib-lang-python/python_object_control_gaps",
]
claims_specimens = [
  "spec-test/sim-runtime/crates/sim-lib-lang-python/src/objects",
  "spec-test/sim-runtime/crates/sim-lib-lang-python/src/resumable",
]
supports = [
  "feature/sim-runtime/guest-language-profiles",
  "feature/sim-runtime/class-semantics",
  "feature/sim-runtime/property-mechanics",
  "feature/sim-runtime/mutation-organ",
  "feature/sim-runtime/gc-tracing",
]

