guidance = "Use this row when maintaining dependency-light incremental calculation. It owns both memoized expression queries and the generic, deterministic dataflow worklist, including graph identity, admitted transfer laws, budgets, continuations, explanations, widening, incremental invalidation, and completion proofs. Domain crates supply transfer rules; they must not add another generic worklist or fixpoint cache. SIM value conversion and runtime loading are owned by the incremental query organ."
