[[feature]]
id = "feature/sim-runtime/gc-tracing"
title = "Bounded tracing garbage collection"
summary = "Reclaim unreachable managed-object cycles with deterministic, failure-atomic stop-the-world tracing."
owner = "crate/sim-lib-gc-tracing"
audiences = ["code", "framework"]
guidance = "Use collect with explicit object, edge, stack, clear, finalizer, and total-work limits over a sim-lib-mutation ManagedArena. Collection plans synchronously at a safepoint and refuses before its allocation-ordered atomic sweep when the complete plan cannot be admitted. Receipt determinism follows the arena's allocation-deterministic managed ids; different legal schedules must preserve safety, not identical reclamation timing. Reuse the language-neutral generated-graph and wasm-closure specimens in the crate test suite; this storage collector claims no language capability."
claims_anchors = [
  "anchor/crate/sim-lib-gc-tracing",
  "anchor/card/cookbook/gc-tracing",
]
claims_specimens = [
  "spec-test/sim-runtime/crates/sim-lib-gc-tracing/src/tests",
]
supports = [
  "feature/sim-runtime/organs",
]

