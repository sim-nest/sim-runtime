schema = "sim.features"

[enforcement.audience]
framework = "strict"
code = "strict"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "advisory"

[enforcement.route]
major_entrypoints = "advisory"
frameworks = "advisory"

[[feature]]
id = "feature/sim-runtime/javascript-core-profile"
title = "Embedded capability-scoped ECMAScript profile"
summary = "Run embedded, capability-scoped ECMAScript over SIM values with ordinary objects, exact UTF-16 strings, explicit drain-to-empty jobs, authorized source modules, and no Node, DOM, timers, ambient host IO, or implicit event loop."
owner = "crate/sim-lib-lang-javascript"
audiences = ["code", "framework"]
guidance = "Use this checked profile as the end of the add-guest-language route for embedded, capability-scoped ECMAScript over SIM values, never as a Node replacement. Enter through codec/javascript and compose shared function plans and exact capture cells, binding, descriptor dispatch, managed identity, sequence, pattern, JSON codec, tracing, resumable-frame, typed-job, diminished read-eval, and source-module mechanics. Keep ordinary-versus-arrow receiver selection, constructor legality, positional default/rest binding, async and generator state, realm identity, and error origins in JavaScript policy; prototype chains and private brands remain exclusively in the property/object subsystem. Carry every thrown JavaScript value through the shared Raised envelope using its realm class identity; Error cause and AggregateError errors remain ordinary descriptor-backed JavaScript properties. JavaScript allocations are ManagedNode values with only an open JavascriptManagedKind role label; allocate them through the generic ManagedHeap and use its checked strong, weak, and ephemeron operations rather than introducing guest graph storage or policy. Generators and async functions exchange shared ResumePacket values; promises, async continuations, and dynamic imports enter the JavaScript language-microtask FIFO and run only at an explicit drain-to-empty checkpoint. Collector finalization has a distinct queue class and checkpoint. ESM resolution is confined to supplied Dir roots and inherits canonical identities, live binding cells, cycle/failure receipts, and installed-codec evaluation from sim-lib-namespace; dynamic source likewise enters only through ReadEvalBroker with host-authored diminished authority. The generated intrinsic manifest covers sparse arrays, iterators, Map, Set, Symbol, exact UTF-16 code units, and JSON reviver/toJSON/replacer/property-order/cycle policy. Ownership audit: keep symbol allocation and the Symbol.for/keyFor registry as the small JavaScript policy anchored at crates/sim-lib-lang-javascript/src/collections.rs::JavascriptSymbolRegistry; sim-kernel/src/id.rs::Symbol is a textual namespace/name value and cannot express fresh identity, description-independent equality, or a realm-local string-keyed registry. Compose iterator storage and insertion-order traversal from crates/sim-lib-sequence/src/mutable.rs::OrderedTableIter and crates/sim-lib-sequence/src/mutable.rs::OrderedSetIter, with only the ECMAScript next-result adapter anchored at crates/sim-lib-lang-javascript/src/collections.rs::JavascriptIterator::next_result; the shared sequence owner already expresses live ordered traversal, while JavaScript policy supplies array-hole materialization and the { value, done } result shape. RegExp syntax and flags remain guest policy, but admitted syntax lowers into the bounded pattern organ; unsupported clauses fail closed. The pattern-ownership.toml Index enforcement policy rejects a guest-owned NFA, backtracking driver, or roadmap-family diagnostic while explicitly classifying syntax parsers and policy adapters. Node, CommonJS, npm, DOM, fetch, timers, filesystem, processes, network, ambient host IO, and an implicit event loop are deliberately absent. Callable browse Shapes remain neutral, and Proxy and exotic-object invariants are explicit gaps; do not add an engine, VM, Realm, scheduler, event loop, matcher, private managed substrate, private module cache, TypeScript policy, or foreign runtime."
claims_anchors = ["anchor/crate/sim-lib-lang-javascript"]
claims_specimens = [
  "spec-test/sim-runtime/crates/sim-lib-lang-javascript/src/lib",
  "spec-test/sim-runtime/crates/sim-lib-sequence/tests/composition_ownership_guard",
  "recipe/sim-runtime/crates/sim-lib-lang-javascript/01-basics/json-codec-composition",
  "recipe/sim-runtime/crates/sim-lib-lang-javascript/01-basics/collection-owner-composition",
]
supports = ["feature/sim-runtime/guest-language-profiles", "feature/sim-runtime/organs", "feature/sim-runtime/gc-tracing"]
composes = ["crate/sim-codec-json", "crate/sim-lib-sequence"]

[[feature]]
id = "feature/sim-runtime/typescript-notation-profile"
title = "TypeScript notation over JavaScript evaluation"
summary = "TypeScript notation; does not type-check. Load admitted notation by direct JavaScript erasure while retaining faithful, non-enforcing Shape metadata and explicit compiler gaps."
owner = "crate/sim-lib-lang-typescript"
audiences = ["code", "framework"]
guidance = "Use codec/typescript to produce an erased JavaScript graph and annotation provenance, then install language/typescript-notation. The profile delegates evaluation unchanged to the JavaScript direct-eval policy and uses sim-shape's neutral BrowseSignature only for observational callable metadata. It performs no binding, inference, narrowing, assignability, source preflight, compiler diagnostics, emit, runtime type guard, object model, module cache, or independent evaluation."
claims_anchors = ["anchor/crate/sim-lib-lang-typescript"]
claims_specimens = [
  "spec-test/sim-runtime/crates/sim-lib-lang-typescript/src/lib",
]
supports = ["feature/sim-runtime/javascript-core-profile", "feature/sim-runtime/guest-language-profiles"]

[[feature]]
id = "feature/sim-runtime/typed-lazy-typeclass-dictionaries"
title = "Typed-lazy typeclass evidence dictionaries"
summary = "Represent a typeclass instance as an explicit language-owned evidence record mapping required method names to implementation symbols."
owner = "crate/sim-lib-lang-typed-lazy"
audiences = ["code", "framework"]
guidance = "Use TypeclassDictionary when the typed-lazy profile must carry explicit evidence that an instance satisfies a typeclass constraint. Compose shared bindings and Shapes for names and admitted values, and managed strong edges when dictionary evidence retains managed implementations. An implementation selected from the dictionary may separately satisfy Callable, but the dictionary itself is neither a Class nor a FunctionInstance or GenericFunction: it witnesses a constraint, owns no declared-parent relation, and performs no call dispatch. The class-ownership and function-ownership ledgers publish and enforce those exclusions."
claims_anchors = ["anchor/crate/sim-lib-lang-typed-lazy"]
claims_specimens = ["spec-test/sim-runtime/crates/sim-lib-lang-typed-lazy/src/lib"]
supports = ["feature/sim-runtime/binding-organ", "feature/sim-runtime/gc-tracing"]

[[feature]]
id = "feature/sim-runtime/prolog-predicate-clause-store"
title = "Prolog predicates as indexed clause sets"
summary = "Keep each Prolog predicate language-owned as the indexed set of logic-organ clauses resolved through unification and backtracking."
owner = "crate/sim-lib-lang-prolog"
audiences = ["code", "framework"]
guidance = "Use the Prolog surface with sim-lib-logic LogicDb for predicate identity, ordered clauses, indexing, unification, backtracking, and constraints. Compose shared bindings and Shapes only at the language boundary. A predicate may be invoked by Prolog goal resolution, but it is neither a Class nor a FunctionInstance or GenericFunction: its clauses are alternatives in relational search, not methods, overloads, or callable bodies. The class-ownership and function-ownership ledgers classify it as a non-participant and publish the mismatch reasons."
claims_anchors = ["anchor/crate/sim-lib-lang-prolog", "anchor/crate/sim-lib-logic"]
claims_specimens = ["spec-test/sim-runtime/crates/sim-lib-logic/src/tests/organ_proof"]
supports = ["feature/sim-runtime/organs", "feature/sim-runtime/binding-organ"]

[[feature]]
id = "feature/sim-runtime/class-semantics"
title = "Language-neutral declared class semantics"
summary = "Own checked declared-parent class descriptors projected onto the kernel Class protocol, with bounded lineage policies and managed, non-retaining caches for linearizations and derived member views."
owner = "crate/sim-lib-class"
audiences = ["code", "framework"]
guidance = "Use sim-lib-class for language-neutral declared superclass graphs. DescriptorClass delegates construction while projecting checked constructor, instance, member, and read-construction metadata through the existing kernel Class, Shape, table, and read-constructor hooks; its subclass query returns bounded traversal evidence. Reuse the kernel Class protocol and compose the C3 algorithm characterized from the Python profile. Use ClassCache for revision-checked linearizations and root-first member views: it composes MANAGED_2 strong parent edges and ephemerons so cached values remain live exactly while its class key is reachable. The class-ownership.toml Index enforcement policy is the machine-readable semantic boundary: it rejects copied descriptors, unbounded lineage walkers, and adapters that recast an excluded edge as declared parents. Its exclusion rows mirror exclusion_ledger mismatch codes, so adding a classified exclusion extends the guard without checker code. JavaScript prototypes, Lua metatables, typeclass dictionaries, Prolog relations, generic dispatch specificity, and JVM defining-loader identity remain with their owners. Do not infer class ancestry from property lookup, metamethod delegation, constraint evidence, predicate names, method applicability, or loader namespaces."
claims_anchors = ["anchor/crate/sim-lib-class"]
claims_specimens = [
  "spec-test/sim-runtime/crates/sim-lib-class/tests/neutral_class_specimens",
  "spec-test/sim-runtime/crates/sim-lib-class/tests/ownership_guard",
  "recipe/sim-runtime/crates/sim-lib-class/01-basics/neutral-class",
]
supports = ["feature/sim-runtime/organs"]

