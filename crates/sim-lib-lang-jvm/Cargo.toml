[package]
name = "sim-lib-lang-jvm"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Manifest-frozen JVM runtime profile for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-runtime"
homepage = "https://github.com/sim-nest/sim-runtime"

[dependencies]
sim-codec-classfile = { version = "0.1.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-class = { version = "0.1.0", path = "../sim-lib-class" }
sim-lib-control = { version = "0.1.5", path = "../sim-lib-control" }
sim-lib-core = { version = "0.1.4", path = "../sim-lib-core" }
sim-lib-gc-tracing = { version = "0.1.0", path = "../sim-lib-gc-tracing" }
sim-lib-machine = { version = "0.1.0", path = "../sim-lib-machine" }
sim-lib-mutation = { version = "0.1.4", path = "../sim-lib-mutation" }
sim-lib-namespace = { version = "0.1.3", path = "../sim-lib-namespace" }
sim-lib-standard-core = { version = "0.1.0", path = "../sim-lib-standard-core" }
sim-text = { version = "0.1.0" }
sim-shape = { version = "0.2.1" }

[dev-dependencies]
toml = "0.8"

[lints]
workspace = true
