[package]
name = "sim-lib-lang-jvm"
version = "0.3.0"
edition = "2024"
license = "MPL-2.0"
description = "Manifest-frozen JVM runtime profile for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-runtime"
homepage = "https://github.com/sim-nest/sim-runtime"

[dependencies]
sim-codec-classfile = { version = "0.2.0" }
sim-kernel = { version = "0.4.0" }
sim-incremental-core = { version = "0.5.0", path = "../sim-incremental-core" }
sim-lib-class = { version = "0.3.0", path = "../sim-lib-class" }
sim-lib-control = { version = "0.3.0", path = "../sim-lib-control" }
sim-lib-core = { version = "0.4.0", path = "../sim-lib-core" }
sim-lib-gc-tracing = { version = "0.3.0", path = "../sim-lib-gc-tracing" }
sim-lib-function = { version = "0.3.0", path = "../sim-lib-function" }
sim-lib-machine = { version = "0.3.0", path = "../sim-lib-machine" }
sim-lib-mutation = { version = "0.3.0", path = "../sim-lib-mutation" }
sim-lib-standard-core = { version = "0.3.0", path = "../sim-lib-standard-core" }
sim-text = { version = "0.3.0" }
sim-shape = { version = "0.4.0" }

[dev-dependencies]
sim-kernel = { version = "0.4.0", features = ["test-support"] }
sim-lib-binding = { version = "0.3.0", path = "../sim-lib-binding" }
sim-lib-logic = { version = "0.3.0", path = "../sim-lib-logic" }
toml = "1.1"

[build-dependencies]
sim-codec-classfile = { version = "0.2.0" }
toml = "1.1"

[lints]
workspace = true
