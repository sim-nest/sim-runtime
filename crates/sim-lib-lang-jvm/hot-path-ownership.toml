schema = "sim.jvm-hot-path-ownership/v1"
source_roadmap = "BYTECODE_SPEED_4"

# This is a source ledger, not an optimization design.  Symbols are deliberately
# exact so the companion test detects ownership drift before performance work.

[[path]]
stage = "decode"
owner = "sim-codec-classfile"
repository = "sim-codecs"
anchor = "crates/sim-codec-classfile/src/instruction.rs"
symbol = "DecodedCode"
fallback = "InstructionDecoder::decode retains the ordinary lossless classfile decode"

[[path]]
stage = "admission and method resolution"
owner = "sim-lib-lang-jvm"
repository = "sim-runtime"
anchor = "crates/sim-lib-lang-jvm/src/entry.rs"
symbol = "ClassfilePermit"
fallback = "ClassfilePermit::resolve refuses foreign or missing members before effects"

[[path]]
stage = "verification"
owner = "sim-lib-lang-jvm"
repository = "sim-runtime"
anchor = "crates/sim-lib-lang-jvm/src/entry.rs"
symbol = "ClassVerifierProvider"
supporting_anchor = "crates/sim-lib-lang-jvm/src/verifier/class_proof.rs"
supporting_symbol = "ClassVerificationProof"
fallback = "NoVerifier retains the StaticChecked tier; rejected or stale exact proofs never authorize unchecked execution"

[[path]]
stage = "preparation"
owner = "sim-lib-lang-jvm composed with sim-lib-machine"
repository = "sim-runtime"
anchor = "crates/sim-lib-lang-jvm/src/code/prepare.rs"
symbol = "prepare_code"
supporting_anchor = "crates/sim-lib-machine/src/code.rs"
supporting_symbol = "LocatedCode"
fallback = "ordinary manifest-decoded instructions freeze into LocatedCode<PreparedJvmPolicy>"

[[path]]
stage = "dispatch and work accounting"
owner = "sim-lib-machine"
repository = "sim-runtime"
anchor = "crates/sim-lib-machine/src/driver.rs"
symbol = "Driver"
supporting_anchor = "crates/sim-lib-machine/src/driver.rs"
supporting_symbol = "WorkReceipt"
fallback = "MachineDriver::drive charges and records each ordinary prepared instruction"

[[path]]
stage = "operand access"
owner = "sim-lib-machine"
repository = "sim-runtime"
anchor = "crates/sim-lib-machine/src/slots.rs"
symbol = "SlotFile"
supporting_anchor = "crates/sim-lib-machine/src/stack.rs"
supporting_symbol = "UnitStack"
fallback = "checked SlotFile and OperandStack access preserves category widths and bounds"

[[path]]
stage = "runtime resolution"
owner = "sim-lib-lang-jvm"
repository = "sim-runtime"
anchor = "crates/sim-lib-lang-jvm/src/resolution.rs"
symbol = "ResolutionCache"
fallback = "cache miss performs the ordinary revision-bound resolution path"

[[path]]
stage = "roots and safepoints"
owner = "sim-lib-machine"
repository = "sim-runtime"
anchor = "crates/sim-lib-machine/src/managed.rs"
symbol = "RootSnapshot"
supporting_anchor = "crates/sim-lib-machine/src/driver.rs"
supporting_symbol = "drive_with_safepoints"
fallback = "RootSnapshot::scan publishes the complete frame view before each declared safepoint"

[[path]]
stage = "cleanup"
owner = "sim-lib-machine"
repository = "sim-runtime"
anchor = "crates/sim-lib-machine/src/stack.rs"
symbol = "clear"
supporting_anchor = "crates/sim-lib-machine/src/slots.rs"
supporting_symbol = "release"
fallback = "ordinary stack clear and initialized-slot release remove retained values"

[[path]]
stage = "benchmark specification and reports"
owner = "sim-tooling BENCH_2"
repository = "sim-tooling"
anchor = "src/bench.rs"
symbol = "BenchSpec"
supporting_anchor = "src/bench/report.rs"
supporting_symbol = "BenchReport"
fallback = "BENCH_2 rejects unmatched hosts or insufficient samples; JVM code owns no clock or report"

[[path]]
stage = "benchmark statistics"
owner = "sim-lib-numbers-stats"
repository = "sim-numbers"
anchor = "crates/sim-lib-numbers-stats/src/implementation.rs"
symbol = "StatsError"
supporting_anchor = "crates/sim-lib-numbers-stats/src/quantile.rs"
supporting_symbol = "QuantileSketch"
fallback = "BENCH_2 reports the statistics refusal instead of substituting JVM-local arithmetic"

