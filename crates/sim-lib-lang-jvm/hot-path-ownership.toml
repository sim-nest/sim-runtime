[[contradiction]]
predecessor_assumption = "extend a JVM-owned PreparedJvmCode representation and drive loop"
landed_source = "prepare_code returns sim_lib_machine::LocatedCode<PreparedJvmPolicy>, and Driver owns the only instruction loop"
disposition = "compose the shared machine owners; do not add a parallel JVM code container or interpreter"

[[contradiction]]
predecessor_assumption = "JVM_6, CLASSFILE_VERIFY_3, LAMBDA_LINK_3, DATAFLOW_1, and BENCH_1 are current owners"
landed_source = "JVM_7, CLASSFILE_VERIFY_4, LAMBDA_LINK_4, DATAFLOW_2, and BENCH_2 have landed"
disposition = "all optimization evidence and ownership resolve against the landed successors"

[[contradiction]]
predecessor_assumption = "EXCEPTIONS_2 is a direct optimization dependency"
landed_source = "EXCEPTIONS_3 shared Raised carriage arrives transitively through JVM_7"
disposition = "retain the shared raised envelope and add no optimizer-local exception carrier"
