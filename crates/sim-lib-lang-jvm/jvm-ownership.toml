schema = "sim.jvm-ownership/v1"
owner = "sim-lib-lang-jvm"

# These source-fact patterns describe ownership forks, not merely vocabulary.
# The guard applies them to declarations and field types in the JVM crate.
forbidden_type_suffixes = [
  "ClassfileParser",
  "OpcodeList",
  "OpcodeTable",
  "OperandStack",
  "FrameStack",
  "PrivateFrame",
  "ShadowManagedGraph",
  "ObjectGraph",
  "Classpath",
  "ClassPath",
  "UnwindPayload",
  "VerificationByteParser",
  "VerificationWorklist",
  "VerificationControlFlowGraph",
  "VerifierOpcodeSwitch",
  "LambdaClassfileGenerator",
  "HostLambdaClosure",
  "ShapeRankedJavaBridge",
  "JvmFunctionOrgan",
  "GlobalLambdaCache",
  "PrivateStatistics",
  "AlternateInterpreter",
  "FusedOpcodeTable",
]
forbidden_function_names = [
  "parse_classfile",
  "drive_method",
  "drive_intrinsic",
  "drive_dynamic",
  "enter_method",
  "execute_method",
  "parse_verification_bytes",
  "verify_opcode",
  "link_lambda_at_method_entry",
  "decode_in_drive",
  "specialize_unchecked",
  "execute_fused_unmapped",
]
forbidden_field_types = ["Vec<u16>", "verified: bool"]
forbidden_source_patterns = [
  "match class_name.as_str()",
  "match binary_name.as_str()",
  "static OPCODE_TABLE:",
]
allowed_public_drive = "drive"
