schema = "sim.jvm-verifier-scope/v1"

[classfile_versions]
minimum_major = 45
minimum_minor = 0
legacy_45_maximum_minor = 3
maximum_major = 69
ordinary_minor = 0
preview_minor = 65535
future_major_policy = "codec-rejection"

[[clause_family]]
id = "4.10.1.1"
name = "type-and-value-accessors"
positive = "accessors-category-widths"
negative = "accessors-invalid-projection"

[[clause_family]]
id = "4.10.1.2"
name = "verification-type-system"
positive = "types-reference-assignable"
negative = "types-category-mismatch"

[[clause_family]]
id = "4.10.1.3"
name = "instruction-representation"
positive = "instruction-located-opcode"
negative = "instruction-invalid-target"

[[clause_family]]
id = "4.10.1.4"
name = "stack-map-frame-representation"
positive = "stack-map-valid-frame"
negative = "stack-map-invalid-offset"

[[clause_family]]
id = "4.10.1.5"
name = "type-checking-abstract-and-instructions"
positive = "abstract-rule-transfer"
negative = "abstract-rule-constraint"

[[clause_family]]
id = "4.10.1.6"
name = "type-checking-methods"
positive = "method-initial-frame"
negative = "method-invalid-return"

[[clause_family]]
id = "4.10.1.7"
name = "type-checking-instructions"
positive = "instruction-valid-transfer"
negative = "instruction-invalid-operands"

[[clause_family]]
id = "4.10.1.8"
name = "type-checking-exceptions"
positive = "exception-valid-handler"
negative = "exception-invalid-handler"

[[clause_family]]
id = "4.10.1.9"
name = "type-checking-code"
positive = "code-complete-flow"
negative = "code-fallthrough-end"

[[clause_family]]
id = "4.10.1.10"
name = "type-checking-classes"
positive = "class-all-methods-valid"
negative = "class-one-method-invalid"

[[failure_boundary]]
condition = "MalformedCodecInput"
home = "codec"

[[failure_boundary]]
condition = "MissingVerificationDependency"
home = "dependency"

[[failure_boundary]]
condition = "VerificationResourceExhausted"
home = "resource"

[[failure_boundary]]
condition = "StaleVerificationProof"
home = "stale-proof"

[[failure_boundary]]
condition = "InternalRuleCoverage"
home = "internal-coverage"

[[failure_boundary]]
condition = "VerificationRejected"
home = "java-verify-error"
java_class = "java/lang/VerifyError"

[integration]
provider_trait = "VerifierProvider"
definition_anchor = "src/entry.rs#VerifierProvider"
invocation_anchor = "src/entry.rs#StaticEntryPermit::verify"
