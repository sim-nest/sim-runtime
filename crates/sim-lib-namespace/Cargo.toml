[package]
name = "sim-lib-namespace"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
description = "Namespace records and capability-aware source module lifecycle for SIM libraries."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-runtime"
homepage = "https://github.com/sim-nest/sim-runtime"

[dependencies]
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-binding = { version = "0.1.4", path = "../sim-lib-binding" }
sim-lib-core = { version = "0.2.0", path = "../sim-lib-core" }
sim-shape = { version = "0.2.1" }

[lints]
workspace = true

[dev-dependencies]
sim-codec-lisp = { version = "0.2.0" }
sim-lib-control = { version = "0.1.3", path = "../sim-lib-control" }
sim-lib-dispatch = { version = "0.1.2", path = "../sim-lib-dispatch" }
sim-lib-mutation = { version = "0.1.2", path = "../sim-lib-mutation" }

[build-dependencies]
sim-cookbook = { version = "0.2.0" }
