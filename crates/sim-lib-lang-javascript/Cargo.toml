[package]
name = "sim-lib-lang-javascript"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Thin direct JavaScript core profile for the SIM expression runtime."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-runtime"
homepage = "https://github.com/sim-nest/sim-runtime"

[dependencies]
sim-cookbook = { version = "0.2.0" }
sim-codec-json = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-binding = { version = "0.1.3", path = "../sim-lib-binding" }
sim-lib-control = { version = "0.1.4", path = "../sim-lib-control" }
sim-lib-dispatch = { version = "0.1.2", path = "../sim-lib-dispatch" }
sim-lib-gc-tracing = { version = "0.1.0", path = "../sim-lib-gc-tracing" }
sim-lib-core = { version = "0.1.3", path = "../sim-lib-core" }
sim-lib-mutation = { version = "0.1.3", path = "../sim-lib-mutation" }
sim-lib-namespace = { version = "0.1.2", path = "../sim-lib-namespace" }
sim-lib-pattern = { version = "0.1.3", path = "../sim-lib-pattern" }
sim-lib-numbers-f64 = { version = "0.3.1" }
sim-lib-numbers-i64 = { version = "0.3.1" }
sim-lib-sequence = { version = "0.1.3", path = "../sim-lib-sequence" }
sim-lib-standard-core = { version = "0.1.3", path = "../sim-lib-standard-core" }
sim-shape = { version = "0.2.0" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
sim-codec-lisp = { version = "0.2.0" }

[build-dependencies]
sim-cookbook = { version = "0.2.0" }
