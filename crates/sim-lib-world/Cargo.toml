[package]
name = "sim-lib-world"
version = "0.1.3"
edition.workspace = true
license.workspace = true
readme = "README.md"
description = "Loadable read-only semantic projection, explanation, planning, explicit model observation, source-seal, and portable proof surface for SIM."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
sim-conformance-core = "0.3.0"
sim-incremental-core = { version = "0.5.2", path = "../sim-incremental-core" }
sim-kernel = { version = "0.4.0" }
sim-lib-journal = "0.3.2"
sim-lib-operation-gate = { version = "0.5.0", path = "../sim-lib-operation-gate" }
sim-lib-roadmap-runner = "0.3.0"
sim-roadmap-core = "0.3.0"
sim-run-core = { version = "0.5.0" }
sim-source-deck = "0.2.0"

[dev-dependencies]
sim-kernel = { version = "0.4.0", features = ["test-support"] }

[lints]
workspace = true
