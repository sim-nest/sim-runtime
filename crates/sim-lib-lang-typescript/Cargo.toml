[package]
name = "sim-lib-lang-typescript"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "TypeScript notation profile over SIM's JavaScript evaluator and Shape metadata."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-runtime"
homepage = "https://github.com/sim-nest/sim-runtime"

[dependencies]
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-lang-javascript = { version = "0.1.0", path = "../sim-lib-lang-javascript" }
sim-lib-standard-core = { version = "0.1.4", path = "../sim-lib-standard-core" }
sim-shape = { version = "0.2.1" }

[build-dependencies]
sim-cookbook = { version = "0.2.0" }
