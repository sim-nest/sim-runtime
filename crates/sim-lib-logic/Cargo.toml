[package]
name = "sim-lib-logic"
version = "0.1.4"
edition = "2024"
license = "MPL-2.0"
description = "Logic programming facts, queries, unification, and backtracking for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-runtime"
homepage = "https://github.com/sim-nest/sim-runtime"

[dependencies]
sim-cookbook = { version = "0.2.0" }
indexmap = "2"
sim-citizen = { version = "0.2.0" }
sim-citizen-derive = { version = "0.2.0" }
sim-codec = { version = "0.1.8" }
sim-kernel = { version = "0.2.0" }
sim-lib-control = { version = "0.1.5", path = "../sim-lib-control" }
sim-lib-core = { version = "0.1.4", path = "../sim-lib-core" }
sim-lib-sequence = { version = "0.1.3", path = "../sim-lib-sequence" }
sim-shape = { version = "0.2.1" }

[dev-dependencies]
sim-codec-lisp = { version = "0.2.0" }
sim-kernel = { version = "0.2.0", features = ["test-support"] }
sim-lib-numbers-arith = { version = "0.3.1" }
sim-lib-numbers-bigint = { version = "0.3.1" }
sim-lib-numbers-f64 = { version = "0.3.1" }
sim-lib-numbers-i64 = { version = "0.3.1" }
sim-table-fs = { version = "0.1.0" }

[lints]
workspace = true

[build-dependencies]
sim-cookbook = { version = "0.2.0" }
