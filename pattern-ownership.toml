schema = "sim.pattern-ownership/v1"
owner = "crates/sim-lib-pattern"
remediation = "Lower guest syntax into sim-lib-pattern PatternProgram and execute it through the bounded shared matcher."
guest_crate_prefix = "sim-lib-lang-"
roadmap_family_terms = ["PATTERN_", "PATTERN2."]

# A private matcher is identified structurally: retained automaton state together
# with transitions, or a recursive/backtracking match driver. Individual words
# such as `state`, `match`, or `parser` are intentionally not findings.
state_fields = ["states", "state_set", "active_states", "backtrack_stack", "choice_stack"]
transition_fields = ["transitions", "edges", "epsilon_edges", "instructions", "program"]
driver_names = ["backtrack", "match_from", "match_here", "run_nfa", "run_matcher"]

[[approved_relationship]]
path = "crates/sim-lib-lang-lua/src/stdlib_string_pattern.rs"
class = "syntax-parser"
reason = "Lua owns surface syntax and lowers it through LuaPatternDialect into the shared pattern program."

[[approved_relationship]]
path = "crates/sim-lib-lang-lua/src/pattern_replace.rs"
class = "policy-adapter"
reason = "Lua replacement and capture policy wraps shared matcher results without owning execution state."

[[approved_relationship]]
