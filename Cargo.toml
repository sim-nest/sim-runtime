
[workspace]
resolver = "3"
members = [
  "crates/sim-incremental-core",
  "crates/sim-lib-incremental",
  "crates/sim-lib-binding",
  "crates/sim-lib-class",
  "crates/sim-lib-control",
  "crates/sim-lib-core",
  "crates/sim-lib-dispatch",
  "crates/sim-lib-exec",
  "crates/sim-lib-function",
  "crates/sim-lib-gc-tracing",
  "crates/sim-lib-lang-cl",
  "crates/sim-lib-lang-clojure",
  "crates/sim-lib-lang-genconf",
  "crates/sim-lib-lang-islisp",
  "crates/sim-lib-lang-julia",
  "crates/sim-lib-lang-javascript",
  "crates/sim-lib-lang-jvm",
  "crates/sim-lib-lang-lua",
  "crates/sim-lib-lang-matrix",
  "crates/sim-lib-lang-python",
  "crates/sim-lib-lang-typescript",
  "crates/sim-lib-lang-prolog",
  "crates/sim-lib-lang-ruby",
  "crates/sim-lib-lang-scheme",
  "crates/sim-lib-lang-typed-lazy",
  "crates/sim-lib-logic",
  "crates/sim-lib-machine",
  "crates/sim-lib-mutation",
  "crates/sim-lib-namespace",
  "crates/sim-lib-operation-gate",
  "crates/sim-lib-pattern",
  "crates/sim-lib-sequence",
  "crates/sim-lib-study",
  "crates/sim-lib-world",
  "crates/sim-lib-standard-core",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-runtime"
homepage = "https://github.com/sim-nest/sim-runtime"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.sim]
docs-command = "cargo run -p xtask -- simdoc"
validation-commands = [
  "cargo fmt --all --check",
  "cargo run -p xtask -- check-local-sources",
  "cargo run -p xtask -- check-managed-substrate",
  "cargo run -p xtask -- check-file-sizes",
  "cargo test -p sim-lib-standard-core --features native-export",
  "cargo test --workspace",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo doc --workspace --no-deps",
  "cargo run -p xtask -- simdoc --check",
  "cargo run -p xtask -- repo-contract --check --repo .",
  "cargo run -p xtask -- validation-matrix --check --repo .",
  "cargo run -p xtask -- crate-catalog --check --repo .",
]
contract-exclusions = [
  { path = "crates/sim-lib-operation-gate/recipes/01-basics/crash-matrix", class = "recipe-fixture", consumer = "crates/sim-lib-operation-gate/recipes/01-basics/crash-matrix/recipe.toml", reason = "The crash-matrix recipe builds this unpublished workspace." },
  { path = "crates/sim-lib-operation-gate/recipes/01-basics/two-manifests", class = "recipe-fixture", consumer = "crates/sim-lib-operation-gate/recipes/01-basics/two-manifests/recipe.toml", reason = "The two-manifests recipe builds this unpublished workspace." },
]
